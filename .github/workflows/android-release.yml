name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build release artifacts without creating a GitHub Release'
        required: false
        default: 'false'
        type: boolean

# Prevent overlapping release builds for the same ref.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-env

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
          ls -la app/keystore.jks

      # Materialise the Firebase config file from the repo secret so the
      # `com.google.gms.google-services` Gradle plugin has something to
      # parse during release assembly/AA/bundle. The file is gitignored
      # so it never lives in the repo.
      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
          ls -la app/google-services.json

      - name: Lint & Unit Tests
        run: ./gradlew lintDebug lintRelease testDebugUnitTest

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$TAG' must match 'v<semver>' (e.g. v2.1.3)."
            exit 1
          fi
          VERSION_NAME="${TAG#v}"
          # versionCode auto-derives from the run number so each release
          # gets a strictly-increasing integer without manual bumping.
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build Release APK and Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE || secrets.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME || secrets.VERSION_NAME }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: ./gradlew assembleRelease bundleRelease

      # Upload the ProGuard mapping.txt to Crashlytics so production
      # crash stack traces are auto-deobfuscated in the console. The
      # `uploadCrashlyticsMappingFileRelease` task is added by the
      # com.google.firebase.crashlytics Gradle plugin.
      - name: Upload mapping to Crashlytics
        run: ./gradlew uploadCrashlyticsMappingFileRelease
        continue-on-error: true

      # Clean up the keystore after the build finishes to avoid leaving
      # signing material in the workspace.
      - name: Remove Keystore
        if: always()
        run: rm -f app/keystore.jks app/google-services.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload ProGuard mapping (for crash deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 365

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
