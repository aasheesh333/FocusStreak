name: Send OneSignal Test Push

on:
  workflow_dispatch:
    inputs:
      heading:
        description: 'Notification heading'
        required: false
        default: '👋 FocusStreak Test'
        type: string
      message:
        description: 'Notification body'
        required: false
        default: 'This is a test push from GitHub Actions.'
        type: string
      segment:
        description: 'OneSignal segment to target'
        required: false
        default: 'Test Users'
        type: string

# This workflow only calls the OneSignal REST API and never writes to
# the repository, so it needs no GitHub token permissions at all.
permissions:
  contents: none

jobs:
  send-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Send push via OneSignal REST API
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          HEADING: ${{ github.event.inputs.heading }}
          MESSAGE: ${{ github.event.inputs.message }}
          SEGMENT: ${{ github.event.inputs.segment }}
        run: |
          set -e
          if [ -z "$ONESIGNAL_APP_ID" ]; then
            echo "::error::ONESIGNAL_APP_ID secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$ONESIGNAL_REST_API_KEY" ]; then
            echo "::error::ONESIGNAL_REST_API_KEY secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Build the JSON body with jq so workflow inputs containing
          # double-quotes, backslashes, or other JSON-special characters
          # are escaped correctly rather than breaking the payload.
          BODY=$(jq -n \
            --arg app_id "$ONESIGNAL_APP_ID" \
            --arg heading "$HEADING" \
            --arg message "$MESSAGE" \
            --arg segment "$SEGMENT" \
            '{
              app_id: $app_id,
              target_channel: "push",
              name: "GitHub Actions Test Push",
              headings: { en: $heading },
              contents: { en: $message },
              included_segments: [ $segment ]
            }')

          curl -sS -X POST 'https://api.onesignal.com/notifications' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H "Authorization: Key ${ONESIGNAL_REST_API_KEY}" \
            -d "$BODY"

          echo "Test push request sent. Check the OneSignal Dashboard > Delivery for status."
